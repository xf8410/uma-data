name: Scenario 8 Cook model rebuild

on:
  push:
    paths:
      - 'scenario_08_cook_model/**'
      - '.github/workflows/scenario-08-cook-model.yml'
  workflow_dispatch:
    inputs:
      train:
        description: 'Run full model training and export'
        required: false
        default: true
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Simulator tests
        run: python -m unittest discover -s scenario_08_cook_model/tests -v
      - name: Syntax and config checks
        run: |
          python -m py_compile scenario_08_cook_model/simulator.py scenario_08_cook_model/benchmark_decks.py scenario_08_cook_model/train.py
          python - <<'PY'
          import json
          d=json.load(open('scenario_08_cook_model/grass_wonder_101101.json',encoding='utf-8'))
          assert d['scenario_id']==8 and d['card_id']==101101 and d['rarity']==5
          cards=json.load(open('scenario_08_cook_model/support_candidates.json',encoding='utf-8'))['cards']
          assert cards['30298']['unique_effect_raw']['value_0_3']==33
          assert cards['30207']['is_cook_link'] is True
          bench=json.load(open('scenario_08_cook_model/deck_benchmark.json',encoding='utf-8'))
          assert bench['results'][0]['deck']==[30275,30277,30264,30293,30289,30207]
          PY

  train:
    if: github.event_name == 'workflow_dispatch' && inputs.train
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training and validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy onnx onnxruntime
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train on whole-run split and validate ONNX
        run: python scenario_08_cook_model/train.py --games 2000 --validation-games 200 --epochs 20 --output scenario_08_cook_model/artifacts
      - name: Enforce release gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open('scenario_08_cook_model/artifacts/training_report.json'))
          assert r['scenario_id']==8 and r['card_id']==101101
          assert r['support_deck']==[30275,30277,30264,30293,30289,30207]
          assert r['whole_run_split'] is True
          assert r['model']['mean'] > r['random_baseline']['mean']
          assert r['onnx_max_abs_error'] < 1e-4
          assert r['onnx_bytes'] > 100000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cook-model-rebuild-${{ github.sha }}
          path: scenario_08_cook_model/artifacts/
          if-no-files-found: error
          retention-days: 30
