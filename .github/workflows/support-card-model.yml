name: Support card model validation

on:
  push:
    paths:
      - 'support_card_model/**'
      - 'master.mdb'
      - '.github/workflows/support-card-model.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and reproduce catalog
        run: |
          python -m py_compile support_card_model/extract_support_card_catalog.py support_card_model/tests/test_support_card_catalog.py
          python -m json.tool support_card_model/support_card_catalog.json >/dev/null
          python -m unittest discover -s support_card_model/tests -v
          python support_card_model/extract_support_card_catalog.py master.mdb -o /tmp/support_card_catalog.json
          cmp support_card_model/support_card_catalog.json /tmp/support_card_catalog.json
