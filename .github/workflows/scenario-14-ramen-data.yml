name: Scenario 14 Ramen data validation

on:
  push:
    paths:
      - 'scenario_14_ramen_model/**'
      - 'single_mode_14_region_*.json'
      - 'master.mdb'
      - '.github/workflows/scenario-14-ramen-data.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and catalog tests
        run: |
          python -m py_compile scenario_14_ramen_model/extract_region_catalog.py
          python -m unittest discover -s scenario_14_ramen_model/tests -v
      - name: Rebuild catalog from master.mdb
        run: |
          python scenario_14_ramen_model/extract_region_catalog.py master.mdb -o /tmp/region_catalog.json
          cmp scenario_14_ramen_model/region_catalog.json /tmp/region_catalog.json
